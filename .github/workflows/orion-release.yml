name: Orion Release

# Builds the native Android app with the on-device gateway inside it, plus the standalone gateway
# package, and publishes them as a GitHub Release.
# Triggers: every push to claude/new-work publishes a pre-release named orion-build-<run number>;
# a tag like `orion-v1.0.0` (or a release created in the GitHub web UI) publishes a normal release;
# the Actions tab can also run it by hand with a tag name once the workflow is on the default branch.
on:
  push:
    branches: [claude/new-work]
    tags: ["orion-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create or update (for example orion-v1.0.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: orion-release-${{ github.sha }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || format('orion-build-{0}', github.run_number) }}
  PRERELEASE: ${{ github.ref_type == 'branch' && 'true' || 'false' }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create the release if it does not exist
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            FLAGS=""
            if [ "$PRERELEASE" = "true" ]; then FLAGS="--prerelease"; fi
            gh release create "$TAG" $FLAGS --title "Orion ${TAG}" --target "${{ github.sha }}" --notes "Orion ${TAG}

          - Orion-${TAG#orion-}.apk: the Android app with the gateway, Node, git and ssh inside. Install it, open Settings, On this phone, tap Set up and start.
          - openclaw-*.tgz: the gateway as a package, for running Orion on a computer or server.
          - orion-setup.sh / orion-setup.mts: one-command setup for that computer or server.

          Commit ${{ github.sha }}"
          fi

  android:
    name: Android APK
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Bundle the on-device runtime (Node, git, ssh from Termux) and the gateway
        run: |
          set -euo pipefail
          node apps/android/scripts/fetch-termux-runtime.mjs
          apps/android/scripts/bundle-gateway.sh

      - name: Prepare signing key
        # Set ORION_ANDROID_KEYSTORE_BASE64, ORION_ANDROID_KEYSTORE_PASSWORD, ORION_ANDROID_KEY_ALIAS and
        # ORION_ANDROID_KEY_PASSWORD as repository secrets so every release is signed by the same key and
        # installs as an update. Without them a one-off key is generated and updates need an uninstall first.
        env:
          KEYSTORE_B64: ${{ secrets.ORION_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ORION_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ORION_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ORION_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/signing"
          KS="$RUNNER_TEMP/signing/orion.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          else
            STORE_PASSWORD="$(openssl rand -hex 16)"; KEY_PASSWORD="$STORE_PASSWORD"; KEY_ALIAS=orion
            keytool -genkeypair -keystore "$KS" -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Orion"
          fi
          mkdir -p "$HOME/.gradle"
          {
            echo "OPENCLAW_ANDROID_STORE_FILE=$KS"
            echo "OPENCLAW_ANDROID_STORE_PASSWORD=$STORE_PASSWORD"
            echo "OPENCLAW_ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "OPENCLAW_ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Build release APK
        working-directory: apps/android
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :app:assembleThirdPartyRelease \
            -PopenclawBuildCommit="$GITHUB_SHA" \
            -PopenclawBuildTimestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Collect APK
        run: |
          set -euo pipefail
          APK="$(ls apps/android/app/build/outputs/apk/thirdParty/release/*.apk | head -n1)"
          # Not dist/: that is the gateway build output folder in the repository.
          mkdir -p apk-out
          NAME="Orion-${TAG#orion-}.apk"
          cp "$APK" "apk-out/$NAME"
          (cd apk-out && sha256sum "$NAME" > "$NAME.sha256")
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/apksigner" verify --print-certs "apk-out/$NAME"
          # Fail the build if the on-device runtime did not make it into the APK.
          unzip -l "apk-out/$NAME" | grep -E "orion-runtime|lib/arm64-v8a/lib(node|git|ssh)" || true
          for need in assets/orion-runtime/libs.tar.gz assets/orion-runtime/gateway.tar.gz assets/orion-runtime/runtime.json lib/arm64-v8a/libnode.so; do
            unzip -l "apk-out/$NAME" | grep -q "$need" || { echo "MISSING from APK: $need"; exit 1; }
          done
          ls -lh apk-out

      - name: Upload to the release
        # Straight to the release: large build artifacts are slow and unreliable to upload.
        run: gh release upload "$TAG" apk-out/* --clobber

  android-tests:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The Android build generates its gateway protocol bindings with the repository's JavaScript tooling.
      - run: pnpm install --no-frozen-lockfile

      - name: Unit tests
        working-directory: apps/android
        run: ./gradlew --no-daemon :app:testThirdPartyDebugUnitTest

  gateway:
    name: Gateway package
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: pnpm install --no-frozen-lockfile

      - name: Typecheck and Orion tests
        run: |
          pnpm tsgo:core
          pnpm vitest run src/orion src/personal

      - name: Pack (builds, then creates the self-contained package)
        run: |
          set -euo pipefail
          # The output folder must not be the repository's dist/ (that is the build output being packed).
          mkdir -p release-out
          node scripts/package-openclaw-for-docker.mjs --allow-unreleased-changelog --output-dir release-out
          cp scripts/orion-setup.sh scripts/orion-setup.mts release-out/
          ls -la release-out

      - name: Upload to the release
        run: gh release upload "$TAG" release-out/* --clobber
