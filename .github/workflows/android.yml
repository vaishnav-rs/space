name: Android CI

# Builds and tests PerfectFrame on every push/PR. This is the real compile: the app depends on
# CameraX / ML Kit / Compose artifacts from Google's Maven, which the dev sandbox can't reach, so
# CI is the source of truth for "does it build".
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish the APK under (creates the tag + release)"
        default: "v1.0.0"
        required: true

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (CompositionEngine)
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: perfectframe-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  # Publishes the debug APK to a GitHub Release when a v* tag is pushed. Debug (not release) is
  # deliberate: the release build has no signing config, so an unsigned release APK can't be
  # installed — the debug APK is debug-signed and installable straight off the Releases page.
  release:
    name: Publish APK to Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: perfectframe-debug-apk
          path: apk

      - name: Rename APK with version tag
        run: |
          mkdir -p dist
          cp apk/*.apk "dist/PerfectFrame-${{ steps.tag.outputs.tag }}.apk"
          ls -la dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          # Create the tag + release from this commit if it doesn't exist yet; otherwise just
          # (re)upload the APK asset so re-runs are idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/PerfectFrame-${TAG}.apk" --clobber
          else
            gh release create "$TAG" \
              "dist/PerfectFrame-${TAG}.apk" \
              --target "${GITHUB_SHA}" \
              --title "PerfectFrame ${TAG}" \
              --prerelease \
              --notes "Debug-signed APK built by CI (installable directly). On-device camera with rule-of-thirds framing guidance, level horizon, and legible auto-exposure."
          fi
